# Noxa with Docker: docker compose up -d, then http://<server>:8420
# The setup code asked on the first page is shown by: docker compose logs noxa
services:
  noxa:
    # published release; to try the test channel, use ghcr.io/xenix13/noxa:test instead
    image: ghcr.io/xenix13/noxa:latest
    container_name: noxa
    restart: unless-stopped
    ports:
      - "8420:8420"
      - "8421:8421"                  # linked servers (TLS): only needed if another Noxa server must reach this one
    environment:
      # behind an HTTPS reverse proxy (nginx, Caddy…): secure cookies and real client IP
      NOXA_COOKIE_SECURE: "0"
      NOXA_TRUST_PROXY: "0"
    volumes:
      - ./data:/data                 # database, image and subtitle cache (must belong to uid 1000)
      - /mnt/films:/media/films:ro   # your media, read-only; add one line per folder
      - /mnt/series:/media/series:ro
      # - /mnt/photos:/media/photos:ro  # photo library ("Photos" library type)
      # - /mnt/livres-audio:/media/livres-audio:ro  # audiobooks ("Audiobooks" library type)
      # - /mnt/nas/noxa:/backups      # backups on another disk (Settings → Backups: /backups)
    # DLNA server (Settings → DLNA): the announcement to TVs does not cross Docker's internal network.
    # Uncomment network_mode and remove the ports section (the host's ports are then used directly).
    # network_mode: host
    # Intel / AMD hardware transcoding (VAAPI): uncomment, and put the GID of the host's "render" group
    # (getent group render) in group_add
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "993"
    # NVIDIA hardware transcoding: driver on the host + NVIDIA Container Toolkit, then uncomment
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu, video, compute, utility]
