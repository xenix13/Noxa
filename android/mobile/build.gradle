// Noxa for Android phones and tablets: the Noxa server's interface (it follows each update of the
// server) in a real app, with what a browser does not do well: fullscreen, file upload,
// app updates from the server. Version specific to the app (independent of the server):
// to raise here when the Java code changes; CI publishes it with each server version.
plugins {
    id 'com.android.application'
}

def keystore = System.getenv('NEXIS_KEYSTORE')

android {
    namespace 'io.github.xenix13.noxa'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.xenix13.noxa'  // fr.nexis.app before 4.5: the app has to be reinstalled once
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '1.3.0'
    }

    signingConfigs {
        release {
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv('NEXIS_KEYSTORE_PASSWORD')
                keyAlias 'nexis'
                keyPassword System.getenv('NEXIS_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // FileProvider: hand the downloaded APK to Android's installer
    implementation 'androidx.core:core:1.13.1'
}
