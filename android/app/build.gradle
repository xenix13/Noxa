// Noxa's Android TV app: native interface and Media3 player (ExoPlayer), data read from the server API.
// Version and signing come from CI (see .github/workflows/tests.yml).
plugins {
    id 'com.android.application'
}

def keystore = System.getenv('NEXIS_KEYSTORE')

android {
    namespace 'io.github.xenix13.noxa.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.xenix13.noxa.tv'  // fr.nexis.tv before 4.5: the app has to be reinstalled once
        minSdk 23
        targetSdk 34
        versionCode((project.findProperty('nexisVersionCode') ?: '1') as int)
        versionName(project.findProperty('nexisVersionName') ?: 'dev')
    }

    signingConfigs {
        release {
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv('NEXIS_KEYSTORE_PASSWORD')
                keyAlias 'nexis'
                keyPassword System.getenv('NEXIS_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // without a provided key (GitHub secrets), development signing: the APK installs, but
            // updates will require uninstalling first
            signingConfig keystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    def media3 = '1.4.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.annotation:annotation-experimental:1.4.1'
}
